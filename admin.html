<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Samira's Kitchen Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Laila:wght@600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Open Sans',sans-serif;background:#Fdfbf7;color:#4a4a4a}h1,h2{font-family:'Laila',serif;font-weight:700;color:#5c5c00}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#5c5c00;position:relative}.login::after{content:'';position:absolute;inset:0;background:linear-gradient(rgba(92,92,0,0.8),rgba(92,92,0,0.9)),url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60"><path d="M30 0 L60 30 L30 60 L0 30 Z" fill="none" stroke="%23F4A460" stroke-width="0.5" opacity="0.1"/></svg>');background-size:60px 60px;z-index:0}.lb{background:#fff;padding:50px;border-radius:20px;max-width:400px;width:100%;text-align:center;box-shadow:0 15px 40px rgba(0,0,0,0.2);position:relative;z-index:2;border-bottom:5px solid #E2725B}.lb h2{margin-bottom:24px;font-size:2rem;color:#5c5c00}.lb input{width:100%;padding:14px;border:1px solid #ddd;border-radius:8px;margin-bottom:15px;font-size:1rem;font-family:'Open Sans',sans-serif;background:#fdfdfd}.lb input:focus{border-color:#E2725B;outline:none}.lb button{width:100%;padding:14px;background:#E2725B;color:#fff;border:none;border-radius:30px;cursor:pointer;font-size:1.1rem;font-family:'Laila',serif;font-weight:700;transition:0.3s}.lb button:hover{background:#d1614a;transform:translateY(-2px)}
.dash{display:none}.dh{background:#fff;color:#5c5c00;padding:20px 40px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px;border-bottom:2px solid #f0f0f0;box-shadow:0 4px 15px rgba(0,0,0,0.03)}.dh h1{font-size:2rem}.dh button,.dh a{padding:10px 24px;border:2px solid #5c5c00;border-radius:30px;cursor:pointer;font-size:0.9rem;color:#5c5c00;background:transparent;text-decoration:none;font-family:'Laila',serif;font-weight:700;transition:0.3s}.dh button:hover,.dh a:hover{background:#5c5c00;color:#fff}.be{background:#E2725B!important;color:#fff!important;border-color:#E2725B!important}.be:hover{background:#d1614a!important;border-color:#d1614a!important}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;padding:40px}.sc{background:#fff;padding:30px;border-radius:15px;text-align:center;box-shadow:0 5px 20px rgba(0,0,0,0.05);border:1px solid #eee}.sl{font-size:0.9rem;color:#7a7a7a;font-weight:600;text-transform:uppercase;letter-spacing:1px}.sv{font-size:3.5rem;font-family:'Laila',serif;margin-top:10px;color:#E2725B}
.tw{padding:0 40px 40px;overflow-x:auto}table{width:100%;border-collapse:collapse;background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 5px 20px rgba(0,0,0,0.05)}th{background:#5c5c00;color:#fff;padding:20px;text-align:left;font-size:0.9rem;text-transform:uppercase;letter-spacing:1px;font-family:'Open Sans',sans-serif;font-weight:600}td{padding:18px 20px;border-bottom:1px solid #eee;font-size:0.95rem;color:#4a4a4a}
select.st{padding:8px 12px;border:1px solid #ddd;border-radius:6px;font-family:'Open Sans',sans-serif;font-size:0.9rem;background:#fdfdfd;color:#4a4a4a;outline:none;font-weight:600}.del{background:none;border:none;color:#999;cursor:pointer;font-size:0.85rem;text-transform:uppercase;letter-spacing:1px;font-weight:700;transition:0.3s}.del:hover{color:#ef4444}
@media(max-width:768px){.stats{grid-template-columns:1fr}}</style></head>
<body>
<div class="login" id="ls"><div class="lb"><h2>Restaurant Manager</h2><input type="text" id="u" value="admin"><input type="password" id="p" placeholder="Password"><button onclick="login()">Login</button></div></div>
<div class="dash" id="dash">
<div class="dh"><h1>Reservations</h1><div><button class="be" onclick="exp()">Export</button> <a href="index.html">View Site</a> <button onclick="logout()">Logout</button></div></div>
<div class="stats"><div class="sc"><div class="sl">Total Bookings</div><div class="sv" id="st">0</div></div><div class="sc"><div class="sl">Pending Confirmation</div><div class="sv" id="sn" style="color:#d97706">0</div></div><div class="sc"><div class="sl">Confirmed</div><div class="sv" id="sd" style="color:#808000">0</div></div></div>
<div class="tw"><table><thead><tr><th>Date Received</th><th>Guest Name</th><th>Contact</th><th>Date & Time</th><th>Guests</th><th>Special Requests</th><th>Status</th><th></th></tr></thead><tbody id="tb"></tbody></table></div></div>
<script>
const K='samiras_reservations';if(sessionStorage.getItem('samiras_admin')==='true')showD();
function login(){if(document.getElementById('u').value==='admin'&&document.getElementById('p').value==='admin123'){sessionStorage.setItem('samiras_admin','true');showD()}else alert('Invalid credentials')}
function logout(){sessionStorage.removeItem('samiras_admin');location.reload()}
function showD(){document.getElementById('ls').style.display='none';document.getElementById('dash').style.display='block';render()}
function gd(){return JSON.parse(localStorage.getItem(K)||'[]').sort((a,b)=>new Date(b.submittedAt)-new Date(a.submittedAt))}
function sv(d){localStorage.setItem(K,JSON.stringify(d))}
function render(){const d=gd();document.getElementById('st').textContent=d.length;document.getElementById('sn').textContent=d.filter(x=>x.status==='Pending Confirmation').length;document.getElementById('sd').textContent=d.filter(x=>x.status==='Confirmed').length;
document.getElementById('tb').innerHTML=d.map(i=>`<tr><td>${new Date(i.submittedAt).toLocaleDateString('en-GB')}</td><td style="font-family:'Laila',serif;font-size:1.1rem;font-weight:700;color:#5c5c00">${i.name||'—'}</td><td>${i.phone}</td><td><strong>${i.date}</strong><br><span style="color:#808000;font-weight:600">${i.time}</span></td><td>${i.guests||'—'}</td><td style="max-width:250px;font-size:0.85rem">${i.requests||'—'}</td><td><select class="st" onchange="upd(${i.id},this.value)">${['Pending Confirmation','Confirmed','Seated','Completed','No Show','Cancelled'].map(s=>`<option ${i.status===s?'selected':''}>${s}</option>`).join('')}</select></td><td><button class="del" onclick="del(${i.id})">Del</button></td></tr>`).join('')}
function upd(id,s){const d=gd();const i=d.find(x=>x.id===id);if(i){i.status=s;sv(d);render()}}
function del(id){if(!confirm('Delete this reservation?'))return;sv(gd().filter(x=>x.id!==id));render()}
function exp(){const d=gd();if(!d.length)return alert('No data');const h=['Date Received','Name','Phone','Reservation Date','Time','Guests','Requests','Status'];const r=d.map(i=>[new Date(i.submittedAt).toLocaleDateString(),i.name,i.phone,i.date,i.time,i.guests,(i.requests||'').replace(/\n/g,' '),i.status]);const c=[h,...r].map(r=>r.map(c=>`"${String(c||'').replace(/"/g,'""')}"`).join(',')).join('\n');const b=new Blob([c],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='samiras_reservations.csv';a.click()}
document.getElementById('p').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
</script></body></html>
